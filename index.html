<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nexo Dashboard</title>

<style>
body{margin:0;font-family:sans-serif;background:#0b0f14;color:#fff;text-align:center}

.screen{display:none}
.active{display:block}

#login{margin-top:20%}
#dashboard{padding:20px}

button{
padding:10px 20px;
margin:10px;
background:#222;
color:#fff;
border:none;
border-radius:8px;
cursor:pointer;
}

input{
padding:10px;
border-radius:6px;
border:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="screen active">
<h1>🔑 Enter Key</h1>
<input id="keyBox" placeholder="Enter key"><br>
<button onclick="login()">Login</button>
<p id="status"></p>

<br>
<a href="https://discord.gg/gJHmxFZ2cZ" target="_blank">
<button>Get Key (Discord)</button>
</a>
</div>

<!-- DASHBOARD PANEL -->
<div id="dashboard" class="screen">
<h1>🔥 Nexo Panel</h1>

<p>Welcome, access granted.</p>

<div>
<button onclick="alert('Scanner started')">Start Scanner</button>
<button onclick="alert('Priority feature')">Priority</button>
</div>

<br>
<p>👥 Active Users: <span id="users">0</span></p>

<br>
<button onclick="logout()">⬅ Exit</button>
</div>

<script>

// 🔥 CHANGE THIS
const API = "https://brainrot-dashboard-ichq.onrender.com";

// LOGIN
async function login(){
let key = document.getElementById("keyBox").value;

try{
let res = await fetch(API + "/validate", {
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
key:key,
fingerprint:navigator.userAgent
})
});

let data = await res.json();

if(data.status === "ok"){
openDashboard();
loadUsers();
setInterval(loadUsers,3000);
}else{
document.getElementById("status").innerText = "❌ Invalid / Expired / Used";
}

}catch(e){
document.getElementById("status").innerText = "❌ Server Offline";
}
}

// SWITCH SCREEN
function openDashboard(){
document.getElementById("login").classList.remove("active");
document.getElementById("dashboard").classList.add("active");
}

// EXIT
function logout(){
location.reload();
}

// LIVE USERS
async function loadUsers(){
try{
let res = await fetch(API + "/users");
let data = await res.json();
document.getElementById("users").innerText = data.count || 0;
}catch{}
}

</script>

</body>
</html>
