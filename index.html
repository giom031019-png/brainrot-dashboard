<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🤡 Scanner Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:'Segoe UI';background:#0b0f14;color:#e0e0e0}

header{text-align:center;padding:20px;font-size:32px;color:#fff;text-shadow:0 0 15px #00ccff}

nav{display:flex;justify-content:center}
nav button{margin:5px;padding:10px 18px;background:#161b22;border-radius:8px;color:#ccc;cursor:pointer}
nav button:hover{background:#222}

.tab{display:none;padding:15px}
.tab.active{display:block}

/* 🔑 KEY PANEL */
.key-box{
background:#14181f;
padding:20px;
border-radius:12px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.key-box button{
padding:12px 20px;
background:#00ccff;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.key-box button:hover{
background:#00aacc;
}

.key-list{
margin-top:20px;
max-height:300px;
overflow:auto;
}

.key-item{
padding:10px;
margin:5px;
border-radius:8px;
background:#1a1f27;
display:flex;
justify-content:space-between;
}

.used{color:red}
.active{color:#00ffcc}

/* login */
#login-screen{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
}

input{
padding:10px;
margin:5px;
border-radius:6px;
border:none;
}

#dashboard-wrapper{display:none}
</style>
</head>

<body>

<div id="login-screen">
<h1>🔐 Enter Key</h1>
<input id="keyInput" placeholder="Enter key">
<button onclick="login()">Login</button>
<p id="error"></p>
</div>

<div id="dashboard-wrapper">

<header>🤡 Scanner Dashboard</header>

<nav>
<button onclick="showTab('dashboard')">Dashboard</button>
<button onclick="showTab('keys')">Key Panel</button>
</nav>

<div id="dashboard" class="tab active">
<h2>Dashboard Running ✅</h2>
<p>Your brainrot system is working.</p>
</div>

<div id="keys" class="tab">
<div class="key-box">

<h2>🔑 Key Generator</h2>

<button onclick="generateKey()">Generate Key</button>

<div class="key-list" id="key-list"></div>

</div>
</div>

</div>

<script>

const SUPABASE_URL = "https://wfqydktbiarmlogkgniu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmcXlka3RiaWFybWxvZ2tnbml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1OTE0MzYsImV4cCI6MjA5MTE2NzQzNn0.nfqeTkKMKDe6uLmypFXJ12HKw96ZBPeZuVKqNx5ikwY";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* 🔑 GENERATE KEY */
function createKey(){
return "brainrot-" + Math.random().toString(36).substring(2,10).toUpperCase();
}

async function generateKey(){
const key = createKey();

await fetch(`${SUPABASE_URL}/rest/v1/keys`,{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
},
body: JSON.stringify({key:key,used:false})
});

loadKeys();
}

/* LOAD KEYS */
async function loadKeys(){
const res = await fetch(`${SUPABASE_URL}/rest/v1/keys?select=*`,{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
});

const data = await res.json();

const list = document.getElementById("key-list");
list.innerHTML="";

data.forEach(k=>{
const div=document.createElement("div");
div.className="key-item";

div.innerHTML = `
<span>${k.key}</span>
<span class="${k.used ? "used" : "active"}">
${k.used ? "USED" : "ACTIVE"}
</span>
`;

list.appendChild(div);
});
}

/* LOGIN WITH KEY */
async function login(){
const key = document.getElementById("keyInput").value;

const res = await fetch(`${SUPABASE_URL}/rest/v1/keys?key=eq.${key}`,{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
});

const data = await res.json();

if(data.length > 0 && !data[0].used){

// mark used
await fetch(`${SUPABASE_URL}/rest/v1/keys?key=eq.${key}`,{
method:"PATCH",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json"
},
body: JSON.stringify({used:true})
});

document.getElementById("login-screen").style.display="none";
document.getElementById("dashboard-wrapper").style.display="block";

loadKeys();

}else{
document.getElementById("error").innerText="Invalid or used key!";
}
}

function showTab(id){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

</script>

</body>
</html>
