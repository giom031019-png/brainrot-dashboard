<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scanner X</title>

<style>
body{background:#0a0c10;color:#fff;font-family:sans-serif;margin:0}
#login{text-align:center;margin-top:20%}
#app{display:none}
.card{background:#111;padding:10px;margin:5px;border-radius:8px;width:220px}
.detections{display:flex;flex-wrap:wrap;justify-content:center}
.insane{animation:shake .2s infinite alternate;box-shadow:0 0 20px red}
@keyframes shake{from{transform:translateX(-2px)}to{transform:translateX(2px)}}
</style>
</head>

<body>

<div id="login">
<input id="pass" placeholder="password">
<button onclick="login()">Enter</button>
</div>

<div id="app">
<h1>Scanner X</h1>

<h2>New</h2>
<div id="new" class="detections"></div>

<h2>Old</h2>
<div id="old" class="detections"></div>

<h2>Leaderboard</h2>
<ul id="board"></ul>
</div>

<script>
const NORMAL="macielissocute"
const PRIO="prio112233"

let seen=new Set()
let oldList=[]

function login(){
  const v=document.getElementById("pass").value
  if(v===NORMAL||v===PRIO){
    document.getElementById("login").style.display="none"
    document.getElementById("app").style.display="block"
  }
}

function makeCard(d){
  const div=document.createElement("div")
  div.className="card"

  if(d.gen>=100000000){
    div.classList.add("insane")
  }

  div.innerHTML=`
  <b>${d.name}</b><br>
  ${d.gen}<br>
  ${d.traits}<br>
  ${d.mutation}<br>
  ${d.owner}
  `
  return div
}

async function load(){
  const res=await fetch("https://brainrot-dashboard-ichq.onrender.com/detections")
  const json=await res.json()
  const data=json.detections||[]

  const newBox=document.getElementById("new")
  const oldBox=document.getElementById("old")

  newBox.innerHTML=""

  data.reverse().forEach(d=>{
    const key=d.name+d.gen+d.owner

    if(!seen.has(key)){
      seen.add(key)
      oldList.push(d)

      if(d.gen>=50000){
        newBox.appendChild(makeCard(d))
      }
    }
  })

  oldBox.innerHTML=""
  oldList.slice(-50).forEach(d=>{
    oldBox.appendChild(makeCard(d))
  })

  updateBoard(oldList)
}

function updateBoard(list){
  const board=document.getElementById("board")
  board.innerHTML=""

  list.sort((a,b)=>b.gen-a.gen).slice(0,10).forEach(d=>{
    const li=document.createElement("li")
    li.innerText=d.name+" - "+d.gen
    board.appendChild(li)
  })
}

setInterval(load,2000)
</script>

</body>
</html>
