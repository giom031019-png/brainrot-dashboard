<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🤡 Scanner X</title>
<style>
/* GLOBAL STYLES */
body{
  margin:0;
  font-family:'Segoe UI';
  background:#0a0c10;
  color:#e0e0e0;
  overflow-x:hidden;
  animation:bgPulse 8s infinite alternate;
}
@keyframes bgPulse{
  0%{background:#0a0c10}
  50%{background:#05070a}
  100%{background:#0a0c10}
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
  font-size:40px;
  animation:glowHeader 2s infinite alternate, floatHeader 4s infinite alternate;
}
@keyframes glowHeader{
  0%{text-shadow:0 0 10px #00ffea,0 0 20px #00ccff;}
  50%{text-shadow:0 0 25px #00ffea,0 0 50px #00ccff;}
  100%{text-shadow:0 0 10px #00ffea,0 0 20px #00ccff;}
}
@keyframes floatHeader{
  0%{transform: translateY(0px)}
  50%{transform: translateY(-12px)}
  100%{transform: translateY(0px)}
}

/* NAVIGATION */
nav{
  display:flex;
  justify-content:center;
  margin-bottom:10px;
  animation:navPulse 3s infinite alternate;
}
@keyframes navPulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.03)}
  100%{transform:scale(1)}
}
nav button{
  margin:5px;
  padding:10px 18px;
  background:#11161f;
  border-radius:8px;
  color:#ccc;
  cursor:pointer;
  transition:.3s;
  animation:btnPulse 2s infinite alternate;
}
nav button:hover{
  transform:scale(1.15);
  background:#00ccff;
  color:#000;
}
@keyframes btnPulse{
  0%{box-shadow:0 0 0px #00ffea;}
  50%{box-shadow:0 0 15px #00ffea;}
  100%{box-shadow:0 0 0px #00ffea;}
}

/* TABS */
.tab{display:none;padding:15px;animation:tabFade 0.5s;}
.tab.active{display:block;}
@keyframes tabFade{
  0%{opacity:0;transform:translateY(10px);}
  100%{opacity:1;transform:translateY(0);}
}

/* STATS */
.stats{
  display:flex;
  justify-content:space-around;
  margin-bottom:10px;
  animation:statsPulse 3s infinite alternate;
}
@keyframes statsPulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* CARDS */
.detections{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  transition:all 0.5s;
}
.card{
  background:#14181f;
  border-radius:12px;
  padding:12px;
  width:260px;
  transition:.3s;
  animation:fadeIn 0.5s ease;
  position:relative;
}
@keyframes fadeIn{
  0%{opacity:0;transform:translateY(20px);}
  100%{opacity:1;transform:translateY(0);}
}
.card:hover{
  transform:scale(1.08);
  box-shadow:0 0 25px #00ffea,0 0 50px #00ccff;
}

/* INSANEEE ANIMATIONS */
.insane{
  animation:insanePulse 0.5s infinite alternate, insaneShake 0.5s infinite alternate;
  position:relative;
}
@keyframes insanePulse{
  0%{box-shadow:0 0 20px red, 0 0 50px yellow;}
  50%{box-shadow:0 0 40px red,0 0 80px yellow;}
  100%{box-shadow:0 0 20px red,0 0 50px yellow;}
}
@keyframes insaneShake{
  0%{transform:translateX(0px);}
  25%{transform:translateX(-3px);}
  50%{transform:translateX(3px);}
  75%{transform:translateX(-3px);}
  100%{transform:translateX(0px);}
}

/* BUTTONS */
.join-btn,.copy-btn{
  display:block;
  margin-top:8px;
  padding:8px;
  border-radius:6px;
  text-align:center;
  transition:0.3s;
  font-weight:bold;
}
.join-btn{
  background:#1f2933;
  color:#fff;
  text-decoration:none;
}
.join-btn:hover{
  background:#00ffea;
  color:#000;
  transform:scale(1.1);
}
.copy-btn{
  background:#333;
  color:#ccc;
  cursor:pointer;
}
.copy-btn:hover{
  background:#00ffea;
  color:#000;
  transform:scale(1.1);
}

/* LEADERBOARD */
.leaderboards{display:flex;gap:15px;margin-top:10px;}
.leaderboard{
  background:#14181f;
  padding:10px;
  border-radius:12px;
  animation:fadeIn 1s ease, leaderGlow 2s infinite alternate;
}
@keyframes leaderGlow{
  0%{box-shadow:0 0 5px #00ffea;}
  50%{box-shadow:0 0 20px #00ffea;}
  100%{box-shadow:0 0 5px #00ffea;}
}
.leaderboard h3{
  text-align:center;
  animation:headerGlow 2s infinite alternate;
}
@keyframes headerGlow{
  0%{color:#00ffea;text-shadow:0 0 5px #00ffea;}
  50%{color:#00ccff;text-shadow:0 0 15px #00ffea,0 0 30px #00ccff;}
  100%{color:#00ffea;text-shadow:0 0 5px #00ffea;}
}
.leaderboard ol{
  list-style:none;
  padding:0;
}
.leaderboard ol li{
  padding:5px;
  margin:2px 0;
  background:#11161f;
  border-radius:6px;
  animation:slideIn 0.5s ease forwards;
  transition:all 0.3s;
}
.leaderboard ol li:hover{
  transform:scale(1.05);
  box-shadow:0 0 15px #00ffea;
}
.leaderboard ol li.top1{animation:rainbowText 2s infinite; font-weight:bold;}
.leaderboard ol li.top2{animation:rainbowText 2.5s infinite; font-weight:bold;}
.leaderboard ol li.top3{animation:rainbowText 3s infinite; font-weight:bold;}
@keyframes slideIn{
  0%{opacity:0;transform:translateX(-20px);}
  100%{opacity:1;transform:translateX(0);}
}
@keyframes rainbowText{
  0%{color:red;}
  25%{color:orange;}
  50%{color:yellow;}
  75%{color:green;}
  100%{color:red;}
}

/* POPUP */
#popup{
  position:fixed;
  top:15%;
  left:50%;
  transform:translateX(-50%);
  padding:20px;
  background:red;
  color:white;
  font-size:30px;
  display:none;
  border-radius:12px;
  animation:pop 0.5s ease, popupGlow 1s infinite alternate;
}
@keyframes pop{
  0%{transform:translate(-50%,-100px);opacity:0}
  100%{transform:translate(-50%,0);opacity:1}
}
@keyframes popupGlow{
  0%{text-shadow:0 0 10px yellow}
  50%{text-shadow:0 0 25px orange}
  100%{text-shadow:0 0 10px yellow}
}
</style>
</head>
<body>
<div id="popup">🔥 INSANEEE 100M+ DETECTED 🔥</div>
<div id="app" style="display:none">
<header>🤡 Scanner X</header>
<nav>
  <button onclick="tab('dash')">Dashboard</button>
  <button id="prioBtn" onclick="tab('prio')" style="display:none">Priority</button>
  <button onclick="tab('leader')">Leaderboard</button>
</nav>

<!-- NORMAL DASHBOARD -->
<div id="dash" class="tab active">
  <div class="stats">
    <div id="total">Brainrots Detected: 0</div>
    <div id="best">Best: None</div>
  </div>
  <div id="new" class="detections"></div>
  <div id="old" class="detections"></div>
</div>

<!-- PRIORITY DASHBOARD -->
<div id="prio" class="tab">
  <div class="stats">
    <div id="ptotal">Brainrots Detected: 0</div>
    <div id="pbest">Best: None</div>
  </div>
  <div id="pnew" class="detections"></div>
  <div id="pold" class="detections"></div>
</div>

<!-- LEADERBOARD -->
<div id="leader" class="tab">
  <div class="leaderboards">
    <div class="leaderboard"><h3>Global</h3><ol id="global"></ol></div>
    <div class="leaderboard"><h3>Priority</h3><ol id="prioList"></ol></div>
    <div class="leaderboard"><h3>Top</h3><ol id="top"></ol></div>
  </div>
</div>
</div>

<script>
// Same logic as previous scripts for fetching detections, updating dashboards, old/new detections, insane popups
// Plus this leaderboard animation logic:
function animateLeaderboard(){
  ['global','prioList','top'].forEach(id=>{
    const list=document.getElementById(id);
    Array.from(list.children).forEach((li,i)=>{
      li.classList.remove('top1','top2','top3');
      if(i==0) li.classList.add('top1');
      else if(i==1) li.classList.add('top2');
      else if(i==2) li.classList.add('top3');
    });
  });
}
setInterval(animateLeaderboard,1000);
</script>
</body>
</html>
