<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🤡 Scanner X</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI';
  background:linear-gradient(135deg,#05070a,#0a0c10,#020305);
  color:#e0e0e0;
  overflow-x:hidden;
}

/* LOGIN */
#login{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}
#login input{
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
}
#login button{
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  background:#00ccff;
  border:none;
  cursor:pointer;
}

/* APP */
#app{display:none;}

header{
  text-align:center;
  font-size:38px;
  padding:15px;
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  0%{text-shadow:0 0 10px cyan;}
  100%{text-shadow:0 0 30px cyan;}
}

nav{text-align:center;}
nav button{
  padding:10px;
  margin:5px;
  border-radius:8px;
  background:#111;
  color:white;
  cursor:pointer;
}

.tab{display:none;}
.tab.active{display:block;}

.stats{
  display:flex;
  justify-content:space-around;
  margin:10px;
}

.detections{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

.card{
  background:#14181f;
  padding:10px;
  border-radius:10px;
  width:250px;
  animation:fadeIn .5s;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;}
}

.insane{
  animation:insane 0.4s infinite alternate;
}
@keyframes insane{
  from{box-shadow:0 0 20px red;}
  to{box-shadow:0 0 50px yellow;}
}

button.copy{
  margin-top:5px;
  padding:5px;
  width:100%;
  cursor:pointer;
}

/* POPUP */
#popup{
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  background:red;
  padding:20px;
  display:none;
  font-size:30px;
}
</style>
</head>

<body>

<div id="popup">🔥 INSANEEE 100M+ DETECTED 🔥</div>

<!-- LOGIN -->
<div id="login">
  <h2>Enter Key</h2>
  <input id="key">
  <br>
  <button onclick="login()">Login</button>
  <p id="err" style="color:red"></p>
</div>

<!-- APP -->
<div id="app">

<header>🤡 Scanner X</header>

<nav>
  <button onclick="tab('dash')">Dashboard</button>
  <button id="prioBtn" onclick="tab('prio')" style="display:none">Priority</button>
</nav>

<div id="dash" class="tab active">
  <div class="stats">
    <div id="count">0 detections</div>
    <div id="best">Best: none</div>
  </div>
  <h3>New</h3>
  <div id="new" class="detections"></div>
  <h3>Old</h3>
  <div id="old" class="detections"></div>
</div>

<div id="prio" class="tab">
  <div class="stats">
    <div id="pcount">0 detections</div>
    <div id="pbest">Best: none</div>
  </div>
  <h3>New</h3>
  <div id="pnew" class="detections"></div>
  <h3>Old</h3>
  <div id="pold" class="detections"></div>
</div>

</div>

<script>

// KEYS
const NORMAL="macielissocute";
const PRIO="prio112233";

function login(){
  let k=document.getElementById("key").value;

  if(k===NORMAL){
    start(false);
  }
  else if(k===PRIO){
    start(true);
  }
  else{
    document.getElementById("err").innerText="Invalid key";
  }
}

function start(prio){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  if(prio) document.getElementById("prioBtn").style.display="inline-block";
}

function tab(id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// STORAGE
let detections=[];
let oldDetections=[];

// ADD DETECTION (SIMULATES LUA DATA)
function addDetection(data){

  detections.push({...data,time:Date.now()});

  render();

  // MOVE TO OLD AFTER 60s
  setTimeout(()=>{
    oldDetections.push({...data,owner:"Owner Left"});
    detections = detections.filter(d=>d!==data);
    render();
  },60000);

  // INSANE POPUP
  if(data.gen>=100000000){
    let pop=document.getElementById("popup");
    pop.style.display="block";
    setTimeout(()=>pop.style.display="none",2000);
  }
}

// RENDER
function render(){
  let newDiv=document.getElementById("new");
  let oldDiv=document.getElementById("old");

  newDiv.innerHTML="";
  oldDiv.innerHTML="";

  let best=0;

  detections.forEach(d=>{
    let c=document.createElement("div");
    c.className="card"+(d.gen>=100000000?" insane":"");
    c.innerHTML=`
      <b>${d.name}</b><br>
      ${d.gen}/s<br>
      Owner: ${d.owner}<br>
      <button class="copy" onclick="navigator.clipboard.writeText('${d.job}')">Copy JobId</button>
    `;
    newDiv.appendChild(c);
    if(d.gen>best) best=d.gen;
  });

  oldDetections.forEach(d=>{
    let c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
      <b>${d.name}</b><br>
      Owner Left
    `;
    oldDiv.appendChild(c);
  });

  document.getElementById("count").innerText=detections.length+" detections";
  document.getElementById("best").innerText="Best: "+best;
}

// 🔥 SIMULATED DATA (REPLACE WITH BACKEND LATER)
setInterval(()=>{
  addDetection({
    name:"Brainrot",
    gen:Math.floor(Math.random()*150000000),
    owner:"Player",
    job:"JOB-"+Math.floor(Math.random()*99999)
  });
},4000);

</script>

</body>
</html>
