<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🤡 Scanner X</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI';
  background:#0a0c10;
  color:#e0e0e0;
}

/* HEADER */
header{
  text-align:center;
  padding:20px;
  font-size:40px;
  text-shadow:0 0 20px #00ffea;
}

/* NAV */
nav{
  display:flex;
  justify-content:center;
}
nav button{
  margin:5px;
  padding:10px 18px;
  background:#11161f;
  border-radius:8px;
  color:#ccc;
  cursor:pointer;
}
nav button:hover{
  background:#00ccff;
  color:#000;
}

/* TABS */
.tab{display:none;padding:15px;}
.tab.active{display:block;}

/* STATS */
.stats{
  display:flex;
  justify-content:space-around;
  margin-bottom:10px;
}

/* CARDS */
.detections{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
}
.card{
  background:#14181f;
  border-radius:12px;
  padding:12px;
  width:260px;
  transition:.3s;
}
.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00ffea;
}

/* INSANE */
.insane{
  animation:shake 0.3s infinite alternate;
  box-shadow:0 0 30px red;
}
@keyframes shake{
  0%{transform:translateX(-2px);}
  100%{transform:translateX(2px);}
}

/* LEADERBOARD */
.leaderboards{display:flex;gap:15px;}
.leaderboard{
  background:#14181f;
  padding:10px;
  border-radius:12px;
}
.leaderboard ol{
  list-style:none;
  padding:0;
}
.leaderboard li{
  padding:5px;
  margin:2px 0;
  background:#11161f;
  border-radius:6px;
}
.top1{color:gold;}
.top2{color:silver;}
.top3{color:#cd7f32;}
</style>
</head>

<body>

<header>🤡 Scanner X</header>

<nav>
  <button onclick="tab('dash')">Dashboard</button>
  <button onclick="tab('prio')">Priority</button>
  <button onclick="tab('leader')">Leaderboard</button>
</nav>

<!-- NORMAL -->
<div id="dash" class="tab active">
  <div class="stats">
    <div id="total">Total: 0</div>
    <div id="best">Best: None</div>
  </div>
  <div id="new" class="detections"></div>
  <h3 style="text-align:center;">Old Detections</h3>
  <div id="old" class="detections"></div>
</div>

<!-- PRIO -->
<div id="prio" class="tab">
  <div class="stats">
    <div id="ptotal">Total: 0</div>
    <div id="pbest">Best: None</div>
  </div>
  <div id="pnew" class="detections"></div>
  <h3 style="text-align:center;">Old Priority</h3>
  <div id="pold" class="detections"></div>
</div>

<!-- LEADERBOARD -->
<div id="leader" class="tab">
  <div class="leaderboards">
    <div class="leaderboard">
      <h3>Top Finds</h3>
      <ol id="top"></ol>
    </div>
  </div>
</div>

<script>
const API = "https://YOUR-RENDER-URL.onrender.com/detections"

let all = []
let oldNormal = []
let oldPrio = []

function tab(id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
  document.getElementById(id).classList.add('active')
}

function makeCard(d, isPrio){
  const div=document.createElement("div")
  div.className="card"

  if(d.gen>=100000000){
    div.classList.add("insane")
  }

  div.innerHTML=`
    <b>${d.name}</b><br>
    ${d.gen}<br>
    ${d.traits}<br>
    ${d.mutation}<br>
    Owner: ${d.owner}<br>
    <div onclick="navigator.clipboard.writeText('${d.jobId}')">📋 Copy JobId</div>
  `

  // 🔥 MOVE TO OLD AFTER 60s
  setTimeout(()=>{
    div.remove()

    if(isPrio){
      oldPrio.unshift(d)
      renderOldPrio()
    }else{
      oldNormal.unshift(d)
      renderOldNormal()
    }

  },60000)

  return div
}

function renderOldNormal(){
  const old=document.getElementById("old")
  old.innerHTML=""
  oldNormal.slice(0,50).forEach(d=>{
    old.appendChild(makeStaticCard(d))
  })
}

function renderOldPrio(){
  const old=document.getElementById("pold")
  old.innerHTML=""
  oldPrio.slice(0,50).forEach(d=>{
    old.appendChild(makeStaticCard(d))
  })
}

function makeStaticCard(d){
  const div=document.createElement("div")
  div.className="card"
  div.innerHTML=`
    <b>${d.name}</b><br>
    ${d.gen}<br>
    Owner: ${d.owner}<br>
    <div onclick="navigator.clipboard.writeText('${d.jobId}')">📋 Copy JobId</div>
  `
  return div
}

async function fetchData(){
  try{
    const res = await fetch(API)
    const data = await res.json()

    document.getElementById("total").innerText = "Total: " + data.total
    document.getElementById("best").innerText = data.bestFind 
      ? "Best: " + data.bestFind.name + " (" + data.bestFind.gen + ")"
      : "Best: None"

    document.getElementById("ptotal").innerText = "Total: " + data.total

    const newDiv = document.getElementById("new")
    const pnewDiv = document.getElementById("pnew")

    data.detections.slice(-10).forEach(d=>{
      if(all.includes(d.timestamp)) return
      all.push(d.timestamp)

      if(d.gen >= 2500000){
        pnewDiv.prepend(makeCard(d,true))
      }else if(d.gen >= 50000){
        newDiv.prepend(makeCard(d,false))
      }
    })

    updateLeaderboard(data.detections)

  }catch(e){}
}

function updateLeaderboard(list){
  const sorted=[...list].sort((a,b)=>b.gen-a.gen).slice(0,10)
  const top=document.getElementById("top")
  top.innerHTML=""

  sorted.forEach((d,i)=>{
    const li=document.createElement("li")
    li.innerText = `${d.name} (${d.gen})`

    if(i==0) li.classList.add("top1")
    if(i==1) li.classList.add("top2")
    if(i==2) li.classList.add("top3")

    top.appendChild(li)
  })
}

setInterval(fetchData,2000)
</script>

</body>
</html>
