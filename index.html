```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🤡 Scanner X</title>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0a0c10;
  color:#eee;
}

/* LOGIN */
#login{
  position:fixed;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}
input{
  padding:10px;
  border-radius:6px;
  border:none;
}
button{
  padding:10px;
  border:none;
  border-radius:6px;
  background:#00ccff;
  cursor:pointer;
}

/* HEADER */
header{
  text-align:center;
  font-size:40px;
  padding:15px;
  text-shadow:0 0 20px #00ffea;
}

/* TABS */
.tab{display:none;padding:10px;}
.active{display:block;}

/* CARDS */
.detections{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
.card{
  background:#14181f;
  padding:10px;
  border-radius:10px;
  width:240px;
}
.card:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #00ffea;
}

/* INSANE */
.insane{
  animation:shake 0.3s infinite alternate;
  box-shadow:0 0 40px red;
}
@keyframes shake{
  0%{transform:translateX(-2px);}
  100%{transform:translateX(2px);}
}

/* LEADERBOARD */
#leaderboard li{
  margin:5px;
  padding:5px;
  border-radius:6px;
  background:#111;
}
.top1{color:gold;font-size:18px;}
.top2{color:silver;}
.top3{color:#cd7f32;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Enter Key</h2>
  <input id="keyInput">
  <br><br>
  <button onclick="login()">Enter</button>
</div>

<div id="app" style="display:none">
<header>🤡 Scanner X</header>

<div id="dash" class="tab active">
  <h3>Dashboard</h3>
  <div id="new" class="detections"></div>
  <h3>Old</h3>
  <div id="old" class="detections"></div>
</div>

<div id="prio" class="tab">
  <h3>Priority</h3>
  <div id="pnew" class="detections"></div>
  <h3>Old</h3>
  <div id="pold" class="detections"></div>
</div>

<div id="leader" class="tab">
  <h3>🏆 Leaderboard</h3>
  <ol id="leaderboard"></ol>
</div>
</div>

<script>
const API="https://YOUR-RENDER-URL.onrender.com/detections"

let oldN=[], oldP=[], seen=[]

function login(){
  const key=document.getElementById("keyInput").value

  if(key==="macielissocute"){
    document.getElementById("login").style.display="none"
    document.getElementById("app").style.display="block"
    document.getElementById("dash").classList.add("active")
  }
  else if(key==="prio112233"){
    document.getElementById("login").style.display="none"
    document.getElementById("app").style.display="block"
    document.getElementById("prio").classList.add("active")
  }
  else{
    alert("Wrong key")
  }
}

function makeCard(d,isPrio){
  const div=document.createElement("div")
  div.className="card"

  if(d.gen>=100000000) div.classList.add("insane")

  div.innerHTML=`
    <b>${d.name}</b><br>
    ${d.gen}<br>
    Owner: ${d.owner}<br>
    <div onclick="navigator.clipboard.writeText('${d.jobId}')">📋 Copy</div>
  `

  setTimeout(()=>{
    div.remove()
    if(isPrio){ oldP.unshift(d); renderOldP() }
    else{ oldN.unshift(d); renderOldN() }
  },60000)

  return div
}

function renderOldN(){
  const el=document.getElementById("old")
  el.innerHTML=""
  oldN.slice(0,50).forEach(d=>el.appendChild(makeStatic(d)))
}

function renderOldP(){
  const el=document.getElementById("pold")
  el.innerHTML=""
  oldP.slice(0,50).forEach(d=>el.appendChild(makeStatic(d)))
}

function makeStatic(d){
  const div=document.createElement("div")
  div.className="card"
  div.innerHTML=`${d.name}<br>${d.gen}`
  return div
}

async function fetchData(){
  const res=await fetch(API)
  const data=await res.json()

  data.detections.slice(-10).forEach(d=>{
    if(seen.includes(d.timestamp)) return
    seen.push(d.timestamp)

    if(d.gen>=2500000){
      document.getElementById("pnew").prepend(makeCard(d,true))
    }else if(d.gen>=50000){
      document.getElementById("new").prepend(makeCard(d,false))
    }
  })

  updateLeaderboard(data.detections)
}

function updateLeaderboard(list){
  const sorted=[...list].sort((a,b)=>b.gen-a.gen).slice(0,10)
  const lb=document.getElementById("leaderboard")
  lb.innerHTML=""

  sorted.forEach((d,i)=>{
    const li=document.createElement("li")
    li.innerText=`${d.name} (${d.gen})`

    if(i==0) li.classList.add("top1")
    if(i==1) li.classList.add("top2")
    if(i==2) li.classList.add("top3")

    lb.appendChild(li)
  })
}

setInterval(fetchData,2000)
</script>

</body>
</html>
