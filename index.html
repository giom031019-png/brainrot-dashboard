<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🤡 Scanner X</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI';
  background:#0a0c10;
  color:#e0e0e0;
}

/* LOGIN */
#login{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}
#login input{
  padding:10px;
  border-radius:8px;
  border:none;
}
#login button{
  padding:10px;
  border:none;
  background:#00ccff;
  cursor:pointer;
  border-radius:8px;
}

/* APP */
#app{display:none}

/* HEADER */
header{
  text-align:center;
  font-size:40px;
  padding:15px;
  animation:glow 2s infinite alternate;
}
@keyframes glow{
  from{ text-shadow:0 0 10px #00ffea;}
  to{ text-shadow:0 0 30px #00ccff;}
}

/* NAV */
nav{
  display:flex;
  justify-content:center;
}
nav button{
  margin:5px;
  padding:10px;
  border:none;
  background:#111;
  color:#ccc;
  cursor:pointer;
  border-radius:6px;
}
nav button:hover{
  background:#00ccff;
  color:#000;
}

/* TABS */
.tab{display:none;padding:15px;}
.tab.active{display:block}

/* DETECTIONS */
.detections{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}
.card{
  background:#14181f;
  padding:10px;
  width:240px;
  border-radius:10px;
  animation:fade 0.4s;
}
@keyframes fade{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1;}
}
.card:hover{
  transform:scale(1.07);
  box-shadow:0 0 20px #00ffea;
}

/* INSANE */
.insane{
  animation:shake 0.3s infinite alternate;
  box-shadow:0 0 25px red,0 0 50px yellow;
}
@keyframes shake{
  from{transform:translateX(-3px);}
  to{transform:translateX(3px);}
}

/* BUTTON */
.copy{
  background:#333;
  padding:5px;
  margin-top:5px;
  text-align:center;
  cursor:pointer;
  border-radius:5px;
}

/* LEADERBOARD */
.leaderboard{
  max-width:400px;
  margin:auto;
}
.leaderboard li{
  padding:6px;
  background:#111;
  margin:3px;
  border-radius:6px;
  animation:slide 0.5s;
}
@keyframes slide{
  from{transform:translateX(-10px);opacity:0;}
  to{transform:translateX(0);}
}
.top1{color:gold;}
.top2{color:silver;}
.top3{color:#cd7f32;}

/* POPUP */
#popup{
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  background:red;
  padding:20px;
  display:none;
  font-size:25px;
  border-radius:10px;
  animation:pop 0.5s;
}
@keyframes pop{
  from{transform:translate(-50%,-100px);opacity:0;}
  to{transform:translate(-50%,0);}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Enter Password</h2>
  <input id="pass" type="password">
  <br><br>
  <button onclick="login()">Enter</button>
</div>

<!-- POPUP -->
<div id="popup">🔥 100M+ DETECTED 🔥</div>

<!-- APP -->
<div id="app">

<header>🤡 Scanner X</header>

<nav>
<button onclick="tab('dash')">Dashboard</button>
<button onclick="tab('prio')">Priority</button>
<button onclick="tab('leader')">Leaderboard</button>
</nav>

<!-- DASH -->
<div id="dash" class="tab active">
<h3>New</h3>
<div id="new" class="detections"></div>
<h3>Old</h3>
<div id="old" class="detections"></div>
</div>

<!-- PRIO -->
<div id="prio" class="tab">
<h3>New</h3>
<div id="pnew" class="detections"></div>
<h3>Old</h3>
<div id="pold" class="detections"></div>
</div>

<!-- LEADER -->
<div id="leader" class="tab">
<ul id="board" class="leaderboard"></ul>
</div>

</div>

<script>
const PASSWORD="brainrot"; // 🔑 CHANGE THIS

let seen=new Set()
let oldList=[]

function login(){
  if(document.getElementById("pass").value===PASSWORD){
    document.getElementById("login").style.display="none"
    document.getElementById("app").style.display="block"
  }
}

function tab(id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))
  document.getElementById(id).classList.add("active")
}

function makeCard(d){
  const div=document.createElement("div")
  div.className="card"

  if(d.gen>=100000000){
    div.classList.add("insane")
    popup()
  }

  div.innerHTML=`
    <b>${d.name}</b><br>
    ${d.gen}<br>
    ${d.traits}<br>
    ${d.mutation}<br>
    Owner: ${d.owner}
    <div class="copy" onclick="copy('${d.jobId}')">Copy JobId</div>
  `
  return div
}

function popup(){
  const p=document.getElementById("popup")
  p.style.display="block"
  setTimeout(()=>p.style.display="none",2000)
}

function copy(t){
  navigator.clipboard.writeText(t)
}

async function load(){
  try{
    const res=await fetch("https://brainrot-dashboard-ichq.onrender.com/detections")
    const data=await res.json()

    const newBox=document.getElementById("new")
    const oldBox=document.getElementById("old")
    const pnew=document.getElementById("pnew")
    const pold=document.getElementById("pold")

    newBox.innerHTML=""
    pnew.innerHTML=""

    data.reverse().forEach(d=>{
      const key=d.name+d.gen+d.owner

      const card=makeCard(d)

      if(!seen.has(key)){
        newBox.appendChild(card)
        if(d.gen>=25000) pnew.appendChild(card.cloneNode(true))
        seen.add(key)
        oldList.push(d)
      }
    })

    oldBox.innerHTML=""
    pold.innerHTML=""

    oldList.slice(-50).forEach(d=>{
      const card=makeCard(d)
      oldBox.appendChild(card)
      if(d.gen>=25000) pold.appendChild(card.cloneNode(true))
    })

    leaderboard(oldList)

  }catch(e){}
}

function leaderboard(list){
  const board=document.getElementById("board")
  board.innerHTML=""

  list.sort((a,b)=>b.gen-a.gen).slice(0,10).forEach((d,i)=>{
    const li=document.createElement("li")
    li.innerText=`${d.name} - ${d.gen}`

    if(i===0) li.classList.add("top1")
    if(i===1) li.classList.add("top2")
    if(i===2) li.classList.add("top3")

    board.appendChild(li)
  })
}

setInterval(load,2000)
</script>

</body>
</html>
